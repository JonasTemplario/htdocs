<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar CEP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Georgia, "Times New Roman", serif;
            background-color: #14306b;
            background-image:
                repeating-linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.04) 0 2px,
                    transparent 2px 18px
                );
        }

        /* Envelope com borda de correio aéreo */
        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px 34px;
            background: #fdfcf8;
            border: 12px solid transparent;
            border-image: repeating-linear-gradient(
                -45deg,
                #d8322c 0 14px,
                #fdfcf8 14px 28px,
                #1d4ba3 28px 42px,
                #fdfcf8 42px 56px
            ) 12;
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.15),
                0 30px 60px -10px rgba(0, 0, 0, 0.55);
            transform: rotate(-1.2deg);
        }

        /* Selo postal */
        .container::before {
            content: "CEP";
            position: absolute;
            top: 24px;
            right: 26px;
            width: 62px;
            height: 76px;
            display: grid;
            place-items: center;
            background: #f2b632;
            color: #14306b;
            font: bold 20px Georgia, serif;
            outline: 4px dotted #f2b632;
            outline-offset: 3px;
            box-shadow: inset 0 0 0 3px rgba(20, 48, 107, 0.25);
        }

        /* Carimbo dos correios sobre o selo */
        .container::after {
            content: "CEP\A BRASIL";
            white-space: pre;
            position: absolute;
            top: 40px;
            right: 70px;
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            text-align: center;
            border: 2px solid rgba(20, 48, 107, 0.55);
            border-radius: 50%;
            color: rgba(20, 48, 107, 0.6);
            font: bold 11px/1.3 "Courier New", monospace;
            transform: rotate(-16deg);
            pointer-events: none;
        }

        h2 {
            margin: 0 0 4px;
            padding-right: 110px;
            font-size: 30px;
            line-height: 1.1;
            color: #14306b;
            letter-spacing: -0.01em;
        }

        form {
            display: flex;
            flex-direction: column;
            margin-top: 54px;
        }

        label {
            margin-bottom: 6px;
            font-size: 14px;
            font-style: italic;
            color: #5b5b66;
        }

        /* Campo como linha de endereço de envelope */
        input[type="number"] {
            width: 100%;
            padding: 10px 4px;
            font: bold 28px "Courier New", Courier, monospace;
            letter-spacing: 0.22em;
            color: #14306b;
            background: transparent;
            border: 0;
            border-bottom: 3px solid #14306b;
            border-radius: 0;
            outline: none;
            appearance: textfield;
            -moz-appearance: textfield;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]::placeholder {
            font-size: 15px;
            font-weight: normal;
            letter-spacing: 0.02em;
            color: #a3a3ad;
        }

        input[type="number"]:focus {
            border-bottom-color: #d8322c;
            background: rgba(216, 50, 44, 0.05);
        }

        /* Botão com efeito de pressionar */
        input[type="submit"] {
            margin-top: 30px;
            padding: 16px;
            font: bold 17px Georgia, serif;
            letter-spacing: 0.03em;
            color: #fff;
            background: #d8322c;
            border: 0;
            border-radius: 6px;
            box-shadow: 0 6px 0 #8f1f1b;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, background-color 0.2s;
        }

        input[type="submit"]:hover {
            background: #e5403a;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #8f1f1b;
        }

        input[type="submit"]:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #8f1f1b;
        }

        input[type="submit"]:focus-visible,
        input[type="number"]:focus-visible {
            outline: 3px solid #f2b632;
            outline-offset: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px 28px;
            }

            .container::before {
                width: 50px;
                height: 62px;
                font-size: 16px;
                right: 18px;
            }

            .container::after {
                width: 64px;
                height: 64px;
                right: 54px;
                font-size: 9px;
            }

            h2 {
                font-size: 26px;
                padding-right: 90px;
            }

            input[type="number"] {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            input[type="number"],
            input[type="submit"] {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buscar CEP</h2>
        <form action="cep.php" method="post">
            <label>Digite o CEP</label>
            <input type="number" id="cep" name="cep" 
            placeholder="Digite apenas números">
            <input type="submit" name="bPesq" 
            value="Pesquisar"> 

            <div class="dados">#resultado</div>
        </form>
    </div>
</body>
</html>
